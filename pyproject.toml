[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-companion"
version = "0.1.0"
description = "Edge multi-agent affective perception prototype for online learning"
requires-python = ">=3.10"
# 运行时依赖 —— **必须与 requirements.txt 保持同一套库、同一批下限**。
# 二者分工不同，不要只改一边：
#   · 这里            → 供 `pip install -e .` / `pip install .` 使用
#   · requirements.txt → 供「按 README 搭环境」使用，且能携带 pip 的索引选项
#                        （CI **不**安装它，见 .github/workflows/tests.yml）
#
# ⚠️ pyproject 表达不了 `--extra-index-url`，因此从 PyPI 装 torch 会拿到
#    捆绑 CUDA / cuDNN / NCCL 的默认 wheel（Linux 上落盘数 GB），
#    而本项目是「端侧纯视觉、普通 CPU」运行。用 pip 装本包时请显式带 CPU 源：
#       pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
#    或者直接走 README 的方式（requirements.txt 里已经挂好该源）。
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "streamlit>=1.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["common*", "agents*", "fusion*", "pipeline*", "app*"]

# ---------------------------------------------------------------------------
# 静态检查（ruff）
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# 显式列出启用的规则集，不依赖 ruff 的默认集 ——
# 默认集会随 ruff 版本变动，那会让 CI 的判定标准在无人改动仓库时发生漂移。
#   E4/E7/E9/E501  pycodestyle 的错误类（含行宽）
#   W              pycodestyle 的告警类
#   F              pyflakes：未使用导入/未定义名字等真正的缺陷
#   I              isort：导入排序
#   UP             pyupgrade：过时写法
#   B              flake8-bugbear：常见易错写法
#   RUF100         无用的 noqa（防止遮蔽规则变动）
select = ["E4", "E7", "E9", "E501", "W", "F", "I", "UP", "B", "RUF100"]
ignore = [
    # B027：agent_base 的两个 close() 刻意提供「空默认实现」而非抽象方法 ——
    # 协议约定子类可以不覆写它，加 @abstractmethod 会改变这条契约。
    "B027",
]

[tool.ruff.lint.isort]
known-first-party = ["common", "agents", "fusion", "pipeline", "app"]

# ---------------------------------------------------------------------------
# 静态类型检查（mypy）
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["common", "fusion", "agents", "pipeline", "app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

# ---------------------------------------------------------------------------
# 覆盖率（pytest-cov / coverage.py）
# ---------------------------------------------------------------------------
# 门槛（fail_under）写在 CI workflow 里，便于一处看到门禁数值。

[tool.coverage.run]
source = ["common", "fusion", "agents", "pipeline", "app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# 纯 GUI 外壳（Tkinter 客户端）：CI 跑在**无显示环境**，这部分代码根本执行不到，
# 留着只会把覆盖率拖破 80% 门槛。可测规则已全部下沉到 `app/present/`（纯函数）。
#
# ⚠️ 必须先于 `app/client/` 的第一行代码存在 —— 否则那个 PR 会一提交就红。
omit = [
    "app/client/*",
]
