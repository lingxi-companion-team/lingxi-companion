[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-companion"
version = "0.1.0"
description = "Edge multi-agent affective perception prototype for online learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["common*", "agents*", "fusion*", "pipeline*", "app*"]
