name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 门禁 0：私有资料防泄漏 ───────────────────────────────────────
  # 仓库是 public，而 .gitignore 只能防「误加」，防不住 `git add -f`。
  # 这里直接检查这些目录里是否真的没有任何文件被 git 跟踪。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: 私有资料不得入库
        run: |
          # `-c core.quotePath=false` 是必须的：git 默认会把含中文的路径
          # 转义成 \344\270\215… 形式，那样下面的 grep 永远匹配不到，
          # 这道门禁会静默失效。已实测验证。
          #
          # ⚠️ 2026-10-04 补 `\.workbuddy-ai`：`.gitignore` 里 `.workbuddy/`
          #    （第 51 行）与 `.workbuddy-ai/`（第 53 行）是两条独立规则，
          #    而原来的 `^\.workbuddy/` 结尾带 `/`、匹配不到 `.workbuddy-ai/`
          #    —— 即 `.workbuddy-ai/` 只被 .gitignore 保护，**没有被这道门禁
          #    保护**。工作记忆与会话数据正落在这个目录，必须一起堵上。
          leaked="$(git -c core.quotePath=false ls-files \
            | grep -E '^(不推送|文档|\.workbuddy|\.workbuddy-ai)/' || true)"
          if [ -n "$leaked" ]; then
            printf '被跟踪的私有文件：\n%s\n' "$leaked"
            echo "::error::私有资料目录中出现被 git 跟踪的文件，必须从仓库移出"
            exit 1
          fi
          echo "OK：私有目录未入库"

  # ── 门禁 1：静态检查（lint + 格式）──────────────────────────────
  # 规则集与行宽在 pyproject.toml 的 [tool.ruff] 段显式声明。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

  # ── 门禁 2：静态类型检查 ───────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: mypy
        run: python -m mypy

  # ── 门禁 3：测试 + 覆盖率门槛 ─────────────────────────────────
  # job id 必须保持为 `pytest`：required status check 的 context
  # 是 `pytest (3.10)` / `pytest (3.12)`，改名会让门禁永远无法满足。
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 覆盖项目声明的最低版本与当前主流版本，
        # 避免只在单一解释器上通过。
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 运行测试 + 覆盖率门槛
        run: >-
          python -m pytest
          --strict-markers
          --strict-config
          --ignore=tests/stress
          --cov
          --cov-report=term-missing
          --cov-fail-under=80

      # 压测**单独跑，且不带覆盖率插桩**。
      #
      # 为什么必须分开（2026-10-02 实测）：`--cov` 的逐行追踪会让纯 Python 执行
      # 慢约**一个数量级** —— 同一台机器、同一条测试，只改这一个开关：
      #     不带 --cov：串行链路单帧中位  2.02 ms   （预算 20 ms）
      #     带   --cov：串行链路单帧中位 22.05 ms   （超预算 10%）
      # 而 `tests/stress` 里有一条预算**是从产品指标推出来的** ——
      # 端到端单帧必须快于采集间隔 `1000 / pipeline.target_fps`（默认 66.7 ms）。
      # 在插桩下量它，等于用一把被拉长的尺子量产品指标：要么随机变红，
      # 要么为了让它变绿而把产品指标改松。两种结果都不能接受。
      #
      # 放在**同一个 job** 里是有意的：这一步失败同样会让 `pytest (3.x)` 这个
      # required check 变红，压测因此不会被绕过。
      - name: 运行压测（不插桩）
        run: python -m pytest tests/stress -q
